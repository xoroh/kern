name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # A DEDICATED job, deliberately. `check:cold` is `rm -rf node_modules
  # packages/*/dist && bun install --frozen-lockfile && bun run build` -- running
  # it inside another job would destroy the workspace for every step after
  # it. It is a cold-checkout release question, so it gets a clean runner of its
  # own, which is also the only honest way to test a cold checkout.
  #
  # It was DARK until now: no workflow invoked it, so the one gate that proves a
  # clean clone can build -- the gate the whole D-037 build lifecycle rests on --
  # was never running.
  cold-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Cold-checkout build and dist check
        run: bun run check:cold

  e2e:
    # WIRED (was reference-only): `e2e/` holds three Playwright specs
    # (dialog-focus-trap, sheet-dismissal, page-render) plus
    # playwright.config.ts and support/. They were reference files nothing
    # ran — no `test:e2e` script, no @playwright/test dependency, no CI job.
    # This job builds the site, serves the BUILD output with `vite preview`
    # on :4173 (never `vite dev`: HMR + a browser context per test exhausted
    # renderer memory and died with `Page crashed` — a harness flake, not a
    # kern defect; see e2e/playwright.config.ts), and runs the specs against
    # it in chromium. Port is pinned, not floating: vite silently takes the
    # next free port when 4173 is busy, and a run pointed at a hardcoded
    # stale port fails with a connection error rather than a real result.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Playwright chromium
        run: bun x playwright install --with-deps chromium

      - name: Build workspace packages
        # REQUIRED on a clean runner: apps/site imports @xoroh/kern via
        # main/module -> ./dist/index.js, and dist/ is gitignored so a fresh
        # checkout has no dist/. The `dist-gates`/`apps` jobs get dists via
        # their own root `bun run build` long before their site build; this
        # job shares no artifacts with them, so it must build them itself
        # before the site build below. Without this, `bun run build` in
        # apps/site fails on a clean runner even though it passes locally
        # (where dists exist from a previous build).
        run: bun run build

      - name: Build site
        run: bun run build
        working-directory: apps/site

      - name: Live-check M3 spec citations
        # `check-spec-urls --live` was opt-in and therefore dark in practice:
        # nothing in CI ever passed the flag, so the landed-page identity
        # check it documents never ran. WIRED here rather than deleted: it
        # now has input (25 recorded specUrl citations, all passing) and
        # asserts landed-page identity, not status codes. Runs in this job
        # because it is network-bound like the specs, not a hermetic gate.
        run: node scripts/check-spec-urls.mjs --live
        working-directory: apps/site

      - name: E2E (chromium, vite preview :4173)
        working-directory: apps/site
        run: |
          bun run preview --port 4173 &
          PREVIEW_PID=$!
          trap "kill $PREVIEW_PID" EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:4173/ > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:4173/ > /dev/null
          cd "$GITHUB_WORKSPACE"
          bun run test:e2e

      - name: Upload visual baseline seed
        # `e2e/visual-baseline.spec.ts` captures full-page screenshots into
        # `test-results/baseline/`. Uploaded so a human can review the
        # picture and promote it into a real `toHaveScreenshot` baseline —
        # never auto-cut, never asserted sight-unseen.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline
          path: test-results/baseline/
          if-no-files-found: warn

  # SPLIT (was one 30-step `build` job): hermetic source gates that need no
  # built dists. No job shares a filesystem with another, so anything that
  # reads dist/ builds it in its own job (`dist-gates`, `apps`, `e2e` above).
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint and format check
        run: bun run lint

      - name: Check contrast and token sources
        run: bun run check:contrast

      - name: Check kern contract
        run: bun run check:kern

      - name: Check the package layering (D-034)
        run: bun run check:layers

      - name: Check every check:* gate is actually invoked by CI
        run: bun run check:workflow

      - name: Check one TypeScript policy
        # 5.9.3 everywhere: two majors in one workspace means two
        # type-checkers that can disagree about the same source.
        run: bun run check:ts-policy

      - name: Check no config rule names a path that no longer exists
        # A dead rule is worse than no rule: it reads as coverage. Proven by
        # planting — the 0020 batch's biome.json override and ci.yml pathspec
        # both go red here, and the ci.yml one is the sharper case because
        # `git diff --exit-code -- <missing>` MEASURED exits 0.
        # generate:routes writes apps/site/src/routeTree.gen.ts (gitignored),
        # which the biome override names. Without it, check:stale-refs reports
        # that override dead on a clean checkout (issue #4).
        run: |
          bun run --cwd apps/site generate:routes
          bun run check:stale-refs

      - name: Check the two renderers agree on resting elevation
        # D-038 follow-on. `check-elevation-parity` asserts one resting elevation
        # per component ACROSS renderers, which is a different question from
        # `check:kern`'s "is this level on the M3 scale at all". The Popover
        # defect (3dp read as level 3 when it is level 2) was invisible to both
        # until this gate existed.
        run: bun run check:elevation-parity

      - name: Sync icon upstream assets
        # packages/kern-icons/assets/material/ is gitignored. check:generated
        # re-runs icons generate against that catalog; without a sync, a clean
        # CI clone fails with "catalog is empty. Sync the upstream assets first".
        # One sync here also feeds icons:check / icons:generate later in the job.
        run: bun run icons:sync

      - name: Check generated output and elevation truth
        run: |
          bun run check:generated
          # The census proves the FRESHNESS LIST IS COMPLETE. Without it,
          # check:generated proves only that the files it happens to name are
          # current — three artifacts in the 23:38 batch were generated,
          # committed, and claimed by nothing.
          bun run check:generated:census
          bun run check:elevation

      - name: Check the pack manifest and registry paths
        run: |
          bun run check:pack
          bun run check:registry-paths

      - name: Check the primitives boundary
        run: bun run check:primitives

      - name: Check every shipped component is exercised by a test
        run: bun run check:coverage

      - name: Check publishable packages are packable
        run: bun run preflight:publish

      - name: Check icon pipeline
        run: bun run icons:check

      - name: Check generated files are in sync
        run: |
          bun run generate:tokens
          bun run generate:tones
          bun run generate:motion
          bun run generate:components
          bun run audit:elevation
          bun run icons:generate
          git add -N .
          git diff --exit-code -- packages/kern-tokens/src/tokens.css packages/kern-tokens/src/tones.css packages/kern-tokens/src/motion.css docs/components.md docs/elevation-audit.md packages/mcp/src/manifest.ts packages/kern-icons/src/sets

  # SPLIT (was inside the 30-step `build` job): the gates that read built
  # dists. Builds them in this job because no job shares a filesystem with
  # another — running these without the build below would report "no dist"
  # and read as a green gate that verified nothing.
  dist-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build all publishable packages
        run: bun run build

      - name: Check web/native parity contract
        # AFTER the build: check:parity inspects built kern-primitives dist .d.ts.
        run: |
          bun run check:parity
          bun run check:currency

      - name: Check kernel consumption against built primitives
        # AFTER the build: check:consumption reads packages/kern-primitives/dist/index.d.ts.
        run: bun run check:consumption

      - name: Check every declared export exists in dist
        run: |
          bun run check:dist
          # AFTER the build, not with the other gates: it inspects the built
          # .d.ts files, so running it earlier would report "no dist" and read as
          # a green gate that verified nothing.
          bun run check:dist:types

  # SPLIT (was inline steps in the 30-step `build` job): per-package
  # build/test/typecheck/publish, one matrix leg each. A leg builds only its
  # own package: workspace deps bundle from source (tsup), so no leg needs
  # another leg's dist.
  #
  # `packages/kern/src/start` is deliberately NOT a leg: it has no
  # package.json (the old job's four "Kern start" steps re-ran `@xoroh/kern`'s
  # own scripts via directory walk-up, testing the same package twice under
  # two names). The `@xoroh/kern` leg below covers it.
  pkg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir:
          - packages/kern-tokens
          - packages/kern-primitives
          - packages/kern
          - packages/kern-icons
          - packages/kern-native
          - packages/mcp
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build package
        run: bun run build
        working-directory: ${{ matrix.dir }}

      - name: Test package
        run: bun run test
        working-directory: ${{ matrix.dir }}

      - name: Test Kern native behaviour (jest)
        # Only kern-native ships .rntest suites; no other leg has the script,
        # so this step is conditional rather than a second matrix axis.
        if: matrix.dir == 'packages/kern-native'
        run: bun run test:jest
        working-directory: ${{ matrix.dir }}

      - name: Typecheck package
        run: bun run typecheck
        working-directory: ${{ matrix.dir }}

      - name: Check package publishing
        run: bun run check:publish
        working-directory: ${{ matrix.dir }}

  # SPLIT (was the tail of the 30-step `build` job): the two apps. Builds
  # workspace dists first because the site typecheck runs check:dist:types,
  # which reads consumed packages' built declarations.
  apps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: bun run build

      - name: Typecheck site
        run: bun run typecheck
        working-directory: apps/site

      - name: Check site docs
        run: bun run check:docs
        working-directory: apps/site

      - name: Check site gallery
        run: bun run check:gallery
        working-directory: apps/site

      - name: Typecheck mobile showcase
        run: bun run typecheck
        working-directory: apps/mobile

      - name: Prove Metro bundles the mobile app
        run: bun run bundle
        working-directory: apps/mobile

      - name: Build site
        run: bun run build
        working-directory: apps/site
