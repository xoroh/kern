name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Lint and format check
        run: bun run lint

      - name: Check contrast and token sources
        run: bun run check:contrast

      - name: Check kern contract
        run: bun run check:kern

      - name: Check web/native parity contract
        run: bun run check:parity

      - name: Check the package layering (D-034)
        run: bun run check:layers

      - name: Check the primitives boundary
        run: bun run check:primitives

      - name: Check publishable packages are packable
        run: bun run preflight:publish

      - name: Check icon pipeline
        run: bun run icons:check

      - name: Check generated files are in sync
        run: |
          bun run generate:tokens
          bun run generate:tones
          bun run generate:motion
          bun run generate:components
          bun run icons:generate
          git add -N .
          git diff --exit-code -- packages/kern-tokens/src/tokens.css packages/kern-tokens/src/tones.css packages/kern-tokens/src/motion.css docs/components.md packages/mcp/src/manifest.ts packages/mcp/src/component-sources.ts packages/kern-icons/src/sets

      - name: Build all publishable packages
        run: bun run build

      - name: Check every declared export exists in dist
        run: bun run check:dist

      - name: Typecheck MCP server
        run: bun run typecheck
        working-directory: packages/mcp

      - name: Test MCP manifest
        run: bun run test
        working-directory: packages/mcp

      - name: Build Kern theme
        run: bun run build
        working-directory: packages/kern-tokens

      - name: Test Kern theme
        run: bun run test
        working-directory: packages/kern-tokens

      - name: Typecheck Kern theme
        run: bun run typecheck
        working-directory: packages/kern-tokens

      - name: Check Kern theme package publishing
        run: bun run check:publish
        working-directory: packages/kern-tokens

      - name: Build Kern library
        run: bun run build
        working-directory: packages/kern

      - name: Test Kern library
        run: bun run test
        working-directory: packages/kern

      - name: Typecheck Kern library
        run: bun run typecheck
        working-directory: packages/kern

      - name: Check Kern package publishing
        run: bun run check:publish
        working-directory: packages/kern

      - name: Build Kern icons
        run: bun run build
        working-directory: packages/kern-icons

      - name: Test Kern icons
        run: bun run test
        working-directory: packages/kern-icons

      - name: Typecheck Kern icons
        run: bun run typecheck
        working-directory: packages/kern-icons

      - name: Check Kern icons package publishing
        run: bun run check:publish
        working-directory: packages/kern-icons

      - name: Build Kern start
        run: bun run build
        working-directory: packages/kern/src/start

      - name: Test Kern start
        run: bun run test
        working-directory: packages/kern/src/start

      - name: Typecheck Kern start
        run: bun run typecheck
        working-directory: packages/kern/src/start

      - name: Check Kern start package publishing
        run: bun run check:publish
        working-directory: packages/kern/src/start

      - name: Build Kern native
        run: bun run build
        working-directory: packages/kern-native

      - name: Test Kern native render
        run: bun run test
        working-directory: packages/kern-native

      - name: Test Kern native behaviour (jest)
        run: bun run test:jest
        working-directory: packages/kern-native

      - name: Typecheck Kern native
        run: bun run typecheck
        working-directory: packages/kern-native

      - name: Check Kern native package publishing
        run: bun run check:publish
        working-directory: packages/kern-native

      - name: Check MCP package publishing
        run: bun run check:publish
        working-directory: packages/mcp

      - name: Typecheck site
        run: bun run typecheck
        working-directory: apps/site

      - name: Typecheck mobile showcase
        run: bun run typecheck
        working-directory: apps/mobile

      - name: Prove Metro bundles the mobile app
        run: bun run bundle
        working-directory: apps/mobile

      - name: Build site
        run: bun run build
        working-directory: apps/site
