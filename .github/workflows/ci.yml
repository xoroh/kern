name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint

      - name: Build MCP server
        run: bun run build
        working-directory: packages/mcp

      - name: Build Kern library
        run: bun run build
        working-directory: packages/kern

      - name: Test Kern library
        run: bun run test
        working-directory: packages/kern

      - name: Typecheck Kern library
        run: bun run typecheck
        working-directory: packages/kern

      - name: Validate agent skills
        run: |
          bun x skills-ref validate ./.agents/skills/kern
          bun x skills-ref validate ./.agents/skills/docs
