name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile --ignore-scripts

      # Site imports @xoroh/kern, which re-exports @xoroh/kern-tokens and pulls
      # @xoroh/kern-primitives. Building only packages/kern fails DTS resolve
      # (TS2307 Cannot find module '@xoroh/kern-tokens'). Root `bun run build`
      # runs generators then scripts/build-order.mjs (topo order from manifests).
      - name: Build packages
        run: bun run build

      - name: Build and deploy site
        run: bun run deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
