<!-- /favicon.svg — the honest brand tile: the same "K on primary" mark the
  rail header renders (a "K" set on the primary color), drawn once here for
  the browser tab. The disc is the Material 3 baseline primary (#6750A4),
  kern's default seed family — the themed site repaints itself, but a
  favicon has no theme context, so it wears the default. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#6750a4"/>
  <text x="32" y="44" font-family="system-ui, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle">K</text>
</svg>
